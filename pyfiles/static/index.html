<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KalamMinds Lab — Retrieval Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=working2" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark"></span>
        <div>
          <p class="eyebrow">KalamMinds AI Research Lab</p>
          <h1>Retrieval Console</h1>
        </div>
      </div>
      <div class="top-meta">
        <div class="status" id="statusPill">
          <span class="dot"></span>
          <span id="statusLabel">Checking system</span>
        </div>
        <button type="button" class="btn-dark btn-compact" id="openSettingsBtn" aria-expanded="false" aria-controls="settingsDrawer">Settings</button>
        <a class="ghost" href="/docs" target="_blank" rel="noreferrer">API schema</a>
      </div>
    </header>

    <aside class="history" aria-label="Chat history">
      <button class="ghost full" id="newChatBtn" type="button">New chat</button>
      <h2>Chats</h2>
      <nav id="chatList" class="chat-list"></nav>
    </aside>

    <main class="stage">
      <div class="thread" id="thread"></div>

      <form class="composer" id="composer">
        <input
          type="file"
          id="fileInput"
          multiple
          accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.md,.doc,.docx,image/*,application/pdf,text/plain"
          hidden
        />
        <ul class="attach-list" id="attachList" hidden></ul>
        <textarea id="prompt" rows="3" placeholder="Enter a query. Shift+Enter for a new line."></textarea>
        <div class="composer-bar">
          <span id="runMeta">Ready</span>
          <div class="composer-actions">
            <button
              type="button"
              class="btn-dark"
              id="attachBtn"
              title="Images & documents: PNG, PDF, TXT, MD, DOCX. Drop files on the input box."
            >
              Attach
            </button>
            <button id="send" type="submit">Run</button>
          </div>
        </div>
      </form>
    </main>

    <div class="settings-backdrop" id="settingsBackdrop" hidden></div>
    <aside class="settings-drawer" id="settingsDrawer" aria-hidden="true" aria-label="Settings">
      <div class="settings-drawer-head">
        <h2 class="drawer-title">Settings</h2>
        <button type="button" class="ghost" id="closeSettingsBtn">Close</button>
      </div>
      <div class="settings-drawer-body">
        <section>
          <h2>System</h2>
          <dl class="facts" id="systemFacts">
            <div><dt>LLM</dt><dd id="factModel">—</dd></div>
            <div><dt>Embed</dt><dd id="factEmbed">—</dd></div>
            <div><dt>Device</dt><dd id="factDevice">—</dd></div>
          </dl>
        </section>

        <section>
          <h2>Mode</h2>
          <div class="segment" role="tablist">
            <button class="seg on" data-mode="rag" type="button">RAG query</button>
            <button class="seg" data-mode="generate" type="button">Direct generate</button>
          </div>
          <p class="hint" id="modeHint">Answers are grounded in the vector store, with citations.</p>
        </section>

        <section>
          <h2>Generation</h2>
          <label>Temperature <span id="tempVal">0.4</span>
            <input id="temperature" type="range" min="0" max="1.5" step="0.05" />
          </label>
          <label>Max tokens <span id="tokVal">1024</span>
            <input id="maxTokens" type="range" min="64" max="2048" step="64" />
          </label>
          <label class="check"><input id="doSample" type="checkbox" checked /> Sample tokens</label>
        </section>

        <section id="ragControls">
          <h2>Retriever</h2>
          <label>Top-k <span id="kVal">1</span>
            <input id="topK" type="range" min="1" max="8" step="1" />
          </label>
          <label>Min score <span id="scoreVal">0.20</span>
            <input id="minScore" type="range" min="0" max="1" step="0.05" />
          </label>
          <label class="check"><input id="useHistory" type="checkbox" checked /> Conversation memory</label>
          <label class="check"><input id="summarize" type="checkbox" /> Two-sentence summary</label>
        </section>
      </div>
    </aside>
  </div>
  <script src="/static/app.js?v=working2"></script>
</body>
</html>
