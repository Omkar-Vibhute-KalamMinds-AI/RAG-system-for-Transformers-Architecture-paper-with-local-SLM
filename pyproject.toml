[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llmops"
version = "0.1.0"
description = "End-to-End LLmOps project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "lancedb>=0.38.0",
    "langchain>=1.4.0",
    "langchain-classic>=1.0.8",
    "langchain-cohere>=0.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "unstructured-pytesseract>=0.3.15",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

# This repo is an app, not a library. Tests import `pyfiles` via sys.path
# (see tests/conftest.py). Pin discovery so setuptools does not treat
# data/, lance_db/, notebook/, LLMOps/, multi_doc_chat/ as packages.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
markers = [
    "integration: cross-module tests using real LanceDB and wired RAG/API paths",
    "slow: on-machine smoke tests against config.yaml paths (GPU/RAM heavy)",
]
testpaths = ["tests"]
filterwarnings = [
    # Starlette TestClient still references anyio.abc.BlockingPortal (deprecated).
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
