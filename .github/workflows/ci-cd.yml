# Build llmops-api + llmops-web and roll ECS.
# Does not bake Gemma/E5/LanceDB; those stay on the task (EFS/host mounts).
#
# GitHub Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# GitHub Variables (optional): AWS_REGION, ECS_CLUSTER, ECS_API_SERVICE,
#   ECS_WEB_SERVICE, ECR_API_REPO, ECR_WEB_REPO

# Create ECR repos before the first run (names default to llmops-api, llmops-web).

name: CI/CD to AWS ECS Fargate

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'my-cluster' }}
  ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE || 'rag-backend-service' }}
  ECS_WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE || 'rag-web-service' }}
  ECR_API_REPO: ${{ vars.ECR_API_REPO || 'llmops-api' }}
  ECR_WEB_REPO: ${{ vars.ECR_WEB_REPO || 'llmops-web' }}

jobs:
  test:
    name: Tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests/test_llmops_project.py -v --tb=short

      - name: Integration tests
        run: python -m pytest tests/test_integration.py -v --tb=short

  deploy:
    name: Build, push, and deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile.base -t llmops-base:cpu .
          docker build -f docker/Dockerfile.api \
            -t "${REGISTRY}/${ECR_API_REPO}:${SHA}" \
            -t "${REGISTRY}/${ECR_API_REPO}:latest" \
            .
          docker build -f docker/Dockerfile.web \
            -t "${REGISTRY}/${ECR_WEB_REPO}:${SHA}" \
            -t "${REGISTRY}/${ECR_WEB_REPO}:latest" \
            .

      - name: Push images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/${ECR_API_REPO}:${SHA}"
          docker push "${REGISTRY}/${ECR_API_REPO}:latest"
          docker push "${REGISTRY}/${ECR_WEB_REPO}:${SHA}"
          docker push "${REGISTRY}/${ECR_WEB_REPO}:latest"

      - name: Render API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: aws/task-definition.api.json
          container-name: api
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ github.sha }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.ECS_API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Render web task definition
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: aws/task-definition.web.json
          container-name: web
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPO }}:${{ github.sha }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          service: ${{ env.ECS_WEB_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false