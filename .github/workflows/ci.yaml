# LLMOps CI — unit + integration tests (no GPU models, no slow E2E).
# Slow tests in tests/test_e2e_slow.py stay skipped unless RUN_SLOW_TESTS=1.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests/test_llmops_project.py -v --tb=short

      - name: Integration tests
        run: python -m pytest tests/test_integration.py -v --tb=short

      - name: Slow E2E (expect skip without RUN_SLOW_TESTS)
        run: python -m pytest tests/test_e2e_slow.py -v --tb=short

      - name: Full suite summary
        run: python -m pytest tests/ -q --tb=line